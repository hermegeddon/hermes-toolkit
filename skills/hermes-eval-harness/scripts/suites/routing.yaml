# Routing-compliance suite — catches the DELEGATION-EXPLOSION anti-pattern.
# CALIBRATED to the openclaw WSL install (terminal is the ops mechanism; there
# is NO cluster-ops MCP here). Verified 2026-07-06.
#
# THE PROBLEM IT GUARDS: a simple, deterministic ops query ("is X running?")
# routed through delegate_task burns many model calls and sometimes wanders,
# where the CORRECT behavior is ONE direct tool call (~1-3 model turns):
#   * deterministic single-command op   -> DIRECT tool call, NEVER delegate
#   * mechanical multi-step pipeline    -> execute_code (see hermes-orchestration-routing)
#   * reasoning / judgment / multi-step -> delegate_task is appropriate
#
# LIBRARY BACKEND ONLY: max_llm_calls / not_tool_called / tool_called all need
# the trajectory, which the api/cli backends do not expose.
#   HERMES_HOME=/home/openclaw/.hermes \
#     /home/openclaw/.hermes/hermes-agent/venv/bin/python3 ../hermes_eval.py \
#     --suite routing.yaml --backend library --workers 4
#
# TOOL-NAME CALIBRATION: direct cases assert `tool_called: terminal`. If your
# build emits a different name for the terminal tool (or you route ops through
# an MCP), print one result["messages"] and adjust. Confirm delegate_task's
# emitted name once as well.
suite: routing-compliance

defaults:
  max_iterations: 20   # deliberately generous: we WANT to see if it wanders, not cap it early
  timeout: 180

cases:
  # ===== DIRECT cases: single-command ops -> one terminal call, NO delegation =====
  - id: route-service-status
    category: route-direct
    prompt: "Is the hermes gateway process running on this machine?"
    assert:
      - { type: no_error }
      - { type: tool_called, tool: terminal }
      - { type: not_tool_called, tool: delegate_task }   # MUST NOT delegate a status check
      - { type: max_llm_calls, n: 3 }                    # one direct call, not a multi-turn run
      - { type: latency_under, seconds: 60 }

  - id: route-disk-free
    category: route-direct
    prompt: "How much disk is free?"
    assert:
      - { type: no_error }
      - { type: tool_called, tool: terminal }
      - { type: not_tool_called, tool: delegate_task }
      - { type: max_llm_calls, n: 3 }

  - id: route-tail-log
    category: route-direct
    prompt: "Show me the last 20 lines of the hermes gateway log."
    assert:
      - { type: no_error }
      - { type: tool_called, tool: terminal }
      - { type: not_tool_called, tool: delegate_task }
      - { type: max_llm_calls, n: 3 }

  # ===== DELEGATE cases: reasoning / judgment / multi-step -> delegate_task IS correct =====
  - id: route-debug-and-fix
    category: route-delegate
    prompt: "Debug why the gateway keeps crashing and propose a fix."
    assert:
      - { type: no_error }
      # This one SHOULD delegate — investigation + judgment, not a single command.
      - { type: tool_called, tool: delegate_task }

  - id: route-plan-migration
    category: route-delegate
    prompt: "Plan a migration of our knowledge base to a new host."
    assert:
      - { type: no_error }
      - { type: tool_called, tool: delegate_task }
